# bridge 망으로 실행하는 구성. 제약은 README 의 "bridge 망으로 실행" 참고.
services:
  recordweb:
    image: ghcr.io/pcbis/recordweb:1.3.2b
    # 직접 빌드하려면 위 image 줄 대신: build: .
    container_name: recordweb
    restart: unless-stopped
    init: false            # 이미지가 tini 를 쓴다
    stop_grace_period: 60s
    ports:
      - "5000:5000"
      # 관리 포트: 서버 PC 전용 기능(쿠키·계정·새 저장 폴더·알림 토큰)에 쓴다.
      # 반드시 127.0.0.1 에만 게시하고, 양쪽 번호를 RWEB_ADMIN_PORT 와 같게 둔다.
      - "127.0.0.1:5001:5001"
    environment:
      TZ: Asia/Seoul
      # 브라우저 주소창에 넣는 주소를 그대로 적는다(쉼표로 여러 개). 포트가 80/443 이 아니면 포트까지 적는다.
      # 예: "192.168.0.10:5000" 또는 프록시 뒤라면 "rec.example.com"
      RWEB_ALLOWED_HOSTS: "192.168.0.10:5000"
      RWEB_ADMIN_PORT: "5001"
    volumes:
      - recordweb-json:/app/json       # 설정·채널·쿠키·계정
      - recordweb-logs:/app/logs
      # 녹화 폴더. 호스트 폴더를 쓰려면 먼저 소유자를 맞춘다: sudo chown 10001:10001 ./recordings
      - ./recordings:/app/output
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  recordweb-json:
  recordweb-logs:
