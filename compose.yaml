# 권장 구성(Linux): 호스트 망을 그대로 쓴다. 원본을 서버에 직접 설치한 것과 같게 동작한다.
services:
  recordweb:
    image: ghcr.io/pcbis/recordweb:1.3.0
    # 직접 빌드하려면 위 image 줄 대신: build: .
    container_name: recordweb
    restart: unless-stopped
    network_mode: host     # 포트는 json/config.json 의 port (기본 5000)
    stop_grace_period: 60s
    environment:
      TZ: Asia/Seoul
      # 리버스 프록시 이름으로 접속할 때만 적는다. 예: "rec.example.com"
      RWEB_ALLOWED_HOSTS: ""
    volumes:
      - recordweb-json:/app/json       # 설정·채널·쿠키·계정
      - recordweb-logs:/app/logs
      # 녹화 폴더. 먼저 소유자를 맞춘다: sudo chown 10001:10001 ./recordings
      - ./recordings:/app/output
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  recordweb-json:
  recordweb-logs:
